name: SBTS Continuous Integration (CI)

on:
  push:
    branches: [ main, master, ts-refactor ]
  pull_request:
    branches: [ main, master, ts-refactor ]

jobs:
  backend-quality:
    name: Backend TypeCheck & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Run TypeScript Strict Check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test -- --runInBand

  frontend-quality:
    name: Frontend Build & Bundle Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend SPA
        working-directory: ./frontend
        run: npm run build

  docker-verification:
    name: Docker Container Build Verification
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose Build
        run: JWT_SECRET="$(openssl rand -hex 32)" ENCRYPTION_KEY="$(openssl rand -hex 32)" docker compose build
