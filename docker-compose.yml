services:
  mongodb:
    image: mongo:7
    container_name: sbts-mongodb
    restart: unless-stopped
    ports:
      # Port 27018 exposed on host to prevent colliding with any local MongoDB service on 27017
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sbts-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sbts-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/SBTS
      - JWT_SECRET=RETIRED_HISTORY_JWT_SECRET
      - DEMO_MODE=false
      - OVERRIDE_DNS=false
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    networks:
      - sbts-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sbts-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - sbts-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional on-demand seeding service: docker compose --profile seed run --rm seed
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sbts-seed
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/SBTS_DEMO
      - OVERRIDE_DNS=false
    command: ["npm", "run", "seed-demo:prod"]
    networks:
      - sbts-network
    profiles:
      - seed

networks:
  sbts-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
