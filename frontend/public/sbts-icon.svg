<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Rounded Base Shield / App Icon Container -->
  <rect width="48" height="48" rx="12" fill="#1e293b"/>
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="#334155" stroke-width="1"/>
  
  <!-- Subtle Gradient Accent Glow -->
  <circle cx="24" cy="24" r="18" fill="url(#brandGlow)" opacity="0.15"/>
  
  <!-- Bus Chassis Outline & Shape -->
  <path d="M12 15C12 13.3431 13.3431 12 15 12H33C34.6569 12 36 13.3431 36 15V29C36 30.6569 34.6569 32 33 32H15C13.3431 32 12 30.6569 12 29V15Z" fill="#3b82f6"/>
  <path d="M12 21H36V28C36 29.6569 34.6569 31 33 31H15C13.3431 31 12 29.6569 12 28V21Z" fill="#2563eb"/>
  
  <!-- Windshield -->
  <rect x="15" y="15" width="18" height="6" rx="2" fill="#e0e7ff"/>
  <line x1="24" y1="15" x2="24" y2="21" stroke="#2563eb" stroke-width="1.5"/>
  
  <!-- Headlights -->
  <circle cx="16" cy="25" r="2" fill="#fef08a"/>
  <circle cx="32" cy="25" r="2" fill="#fef08a"/>
  
  <!-- Front Bumper & Grill -->
  <rect x="20" y="24" width="8" height="2" rx="1" fill="#1d4ed8"/>
  <rect x="14" y="28.5" width="20" height="2" rx="1" fill="#1e293b"/>
  
  <!-- Wheels -->
  <rect x="13" y="32" width="5" height="4" rx="1.5" fill="#0f172a"/>
  <rect x="30" y="32" width="5" height="4" rx="1.5" fill="#0f172a"/>

  <!-- GPS Signal Pulse Pin (Top Accent) -->
  <circle cx="34" cy="11" r="3.5" fill="#10b981"/>
  <circle cx="34" cy="11" r="5" stroke="#10b981" stroke-width="1" opacity="0.5"/>

  <defs>
    <radialGradient id="brandGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(24 24) rotate(90) scale(18)">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
